[package]
name = "work"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/anoldguy/work"
description = "Navigate and sync your GitHub repositories"
readme = "README.md"
keywords = ["cli", "github", "repositories", "navigation", "productivity"]
categories = ["command-line-utilities", "development-tools"]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "color", "suggestions", "string"] }
clap_complete = "4.5"
crossterm = { version = "0.29", default-features = false, features = ["events"] }
indicatif = { version = "0.18", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std"] }
nucleo-matcher = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml_edit = { version = "0.23", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2.0"
proptest = "1.7"
tempfile = "3.23"

