disallowed-macros = [
    { path = "std::print", reason = "write through ui::Ui" },
    { path = "std::println", reason = "write through ui::Ui" },
    { path = "std::eprint", reason = "write through ui::Ui" },
    { path = "std::eprintln", reason = "write through ui::Ui" },
    { path = "std::dbg", reason = "write through ui::Ui" },
]
disallowed-methods = [
    { path = "std::io::stdout", reason = "only ui::Ui owns stdout" },
    { path = "std::io::stderr", reason = "only ui::Ui owns stderr" },
    { path = "std::process::Command::new", reason = "build children with proc::command" },
    { path = "std::process::Stdio::inherit", reason = "hand a child the terminal through proc::Interactive" },
]
